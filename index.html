<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="From the Studio — a demo of the art catalogue and auction platform. Mocked data, all actions simulated in your browser." />
    <title>From the Studio — demo</title>
    <meta name="theme-color" content="#0c1210" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1210'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%236ee0a1' stroke-width='2.5'/%3E%3Cpath d='M16 23v-14M16 5l5 5M11 23l5-5' stroke='%236ee0a1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="assets/samples/scene-night.webp" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/demo.css" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function (d) {
        try {
          var t = localStorage.getItem('ap_theme') || 'dark';
          d.dataset.theme = t;
          var f = localStorage.getItem('ap_frost');
          if (f) d.style.setProperty('--frost', f);
          if (localStorage.getItem('ap_rail') === '1') d.dataset.rail = 'true';
          var meta = d.querySelector('meta[name="theme-color"]');
          if (meta && t === 'light') meta.setAttribute('content', '#dfe6e1');
        } catch (e) {}
      })(document.documentElement);
    </script>
  </head>
  <body>
    <a class="skip" href="#main-content">Skip to content</a>
    <div class="app" id="shell"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
